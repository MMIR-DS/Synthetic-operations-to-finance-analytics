name: Sync portfolio ZIP

on:
  push:
    branches: [sync-v1.9.0.1]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[sync-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sync-v1.9.0.1
          fetch-depth: 0

      - name: Download portfolio ZIP
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors \
            -o /tmp/portfolio.zip \
            'https://uploadkon.ir/uploads/c0f306_26OEE-Revenue-CM-Portfolio-v1-9-0-1-dairy.zip'
          rm -rf /tmp/portfolio
          unzip -q /tmp/portfolio.zip -d /tmp/portfolio

      - name: Replace repository project files
        run: |
          set -euo pipefail
          src=/tmp/portfolio
          if [ -d "$src/OEE_Revenue_CM_Portfolio_v1_9_0_1_dairy" ]; then
            src="$src/OEE_Revenue_CM_Portfolio_v1_9_0_1_dairy"
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$src"/. .
          git add -A
          git status --short

      - name: Commit synchronized project
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync OEE Revenue CM Portfolio v1.9.0.1 [sync-bot]' || echo 'No changes to commit'
          git push origin sync-v1.9.0.1
